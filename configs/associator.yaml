association:
  max_position_distance_px: 250.0
  position_weight: 0.55
  overlap_weight: 0.20
  size_weight: 0.10
  class_weight: 0.15
  max_cost: 0.75
  min_observations_confirmed: 5
  min_keyframes_confirmed: 3
  min_top_class_ratio: 0.60
  max_votes_per_track: 3
  online_gate_ratio: 0.50
  centroid_distance_threshold: 30.0
  track_reactivate_max_gap_frames: 15
  # Same-frame same-class boxes at or below this smaller-box containment
  # are durable evidence of two separable physical instances.
  independent_co_occurrence_max_containment: 0.25
  partial_duplicate_min_containment: 0.75
  partial_duplicate_max_normalized_distance: 0.75
  partial_duplicate_max_absolute_distance_px: 80.0
  partial_duplicate_min_mapping_quality: 0.50
  partial_duplicate_max_area_ratio: 0.60
  partial_duplicate_min_candidate_margin: 0.15

  per_class_gate_ratios: {}

  per_class_position_gates: {}

class_compatibility:
  flashlight:
    - flashlight
    - telescopic_voltage_detector
  telescopic_voltage_detector:
    - telescopic_voltage_detector
    - flashlight
